[package]
name = "no_alloc_driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rustc_driver wrapper binary that runs the no_alloc analysis as the compiler."
build = "build.rs"

[[bin]]
name = "no-alloc-driver"
path = "src/main.rs"

[dependencies]
no_alloc_analysis = { workspace = true }
no_alloc_report = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
