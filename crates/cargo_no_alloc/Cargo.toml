[package]
name = "cargo-no-alloc"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Statically checks that marked Rust functions cannot reach the global allocator."
readme = "../../README.md"
keywords = ["allocation", "realtime", "static-analysis", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools"]
build = "build.rs"

[[bin]]
name = "cargo-no-alloc"
path = "src/main.rs"

[[bin]]
name = "no-alloc-driver"
path = "src/bin/no-alloc-driver.rs"

# Linux x86_64 only, matching build.rs's toolchain check: the release
# workflow only publishes that one target's archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-no-alloc-{ target }.tar.gz"
pkg-fmt = "tgz"

[dependencies]
anyhow = { workspace = true }
fs2 = { workspace = true }
no_alloc_analysis = { workspace = true }
no_alloc_report = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
