[workspace]
resolver = "3"
members = [
    "crates/no_alloc",
    "crates/no_alloc_macros",
    "crates/no_alloc_report",
    "crates/no_alloc_analysis",
    "crates/no_alloc_driver",
    "crates/cargo_no_alloc",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dw/no_alloc"

[workspace.dependencies]
no_alloc_macros = { path = "crates/no_alloc_macros" }
no_alloc_report = { path = "crates/no_alloc_report" }
no_alloc_analysis = { path = "crates/no_alloc_analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 1

# The workspace root is also a package: `tests/ui.rs` (the regression
# suite, driving the built `cargo-no-alloc`/`no-alloc-driver` binaries
# against `tests/ui/<case>/` fixtures) and `benches/` sit here rather than
# inside any one crate, since they exercise the whole toolchain end to end,
# not one crate's API.
[package]
name = "no_alloc_harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
no_alloc_report = { workspace = true }
serde_json = { workspace = true }
criterion = "0.5"

[[bench]]
name = "report"
harness = false

[[bench]]
name = "throughput"
harness = false
