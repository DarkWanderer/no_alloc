name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing steps (build and package only)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Read and cross-check crate versions
        id: read
        run: |
          set -euo pipefail
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name | test("^(no_alloc_report|no_alloc_check|no_alloc_analysis|cargo-no-alloc)$")) | .version' \
            | sort -u)
          count=$(echo "$versions" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::published crate versions are out of sync: $versions"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux binaries
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-09-04
          components: rustc-dev,rust-src,llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          add-job-id-key: false
          cache-targets: false

      - name: Build cargo-no-alloc and no-alloc-driver
        run: cargo build --release -p cargo-no-alloc

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/cargo-no-alloc target/release/no-alloc-driver dist/

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-x64
          path: dist/*
          if-no-files-found: error

  publish-crates:
    name: Publish to crates.io
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-09-04
          components: rustc-dev,rust-src,llvm-tools-preview

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Dependency order: no_alloc_report/no_alloc_check first (no path
      # deps), then no_alloc_analysis (depends on no_alloc_report), then
      # cargo-no-alloc (depends on both). See adr/0001 and AGENTS.md.
      - name: Publish crates in dependency order
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_if_needed() {
            local name="$1"
            # crates.io's data-access policy 403s requests with no identifying User-Agent
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "User-Agent: no_alloc-release-workflow (https://github.com/DarkWanderer/no_alloc)" \
              "https://crates.io/api/v1/crates/${name}/${RELEASE_VERSION}")
            if [ "$code" = "200" ]; then
              echo "${name} ${RELEASE_VERSION} already published, skipping"
              return
            fi
            cargo publish -p "$name"
          }
          publish_if_needed no_alloc_report
          publish_if_needed no_alloc_check
          publish_if_needed no_alloc_analysis
          publish_if_needed cargo-no-alloc

  github-release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-linux-x64
          path: artifacts

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          chmod +x artifacts/cargo-no-alloc artifacts/no-alloc-driver
          tar -czf release-assets/cargo-no-alloc-x86_64-unknown-linux-gnu.tar.gz \
            -C artifacts cargo-no-alloc no-alloc-driver
          (cd release-assets && sha256sum ./*.tar.gz > cargo-no-alloc-checksums.txt)

      - name: Create tag and publish GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
