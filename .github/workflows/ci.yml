name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-08-01
          components: rustc-dev,rust-src,llvm-tools-preview,rustfmt,clippy
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo +stable test -p no_alloc_check -p no_alloc_report
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      # ui_matrix is excluded here, so no_alloc_analysis (leaf.rs,
      # traversal.rs, roots.rs) is not measured. Two earlier blockers were
      # fixed in tests/ui.rs and are no longer the reason:
      #   - run_case() now strips RUSTC_WRAPPER/RUSTC_WORKSPACE_WRAPPER, so
      #     the fixtures no longer all bail with "existing RUSTC_WRAPPER ...
      #     is incompatible with cargo-no-alloc" under cargo-llvm-cov.
      #   - cargo_no_alloc_bin() now resolves the binary relative to the test
      #     executable rather than trusting CARGO_TARGET_DIR.
      # The remaining blocker is upstream of both: `cargo llvm-cov` does not
      # build the workspace's bin targets into its own target directory at
      # all (target/llvm-cov-target/debug/ contains only examples/), so no
      # instrumented cargo-no-alloc/no-alloc-driver ever exists for the
      # fixtures to invoke. ui_matrix therefore runs against the ordinary
      # uninstrumented binary: it passes, but contributes no coverage for
      # no_alloc_analysis while costing several minutes. Measured directly:
      # including it moves the total 80.3% -> 81.3%, all of which is
      # cargo_no_alloc/src/lib.rs, with no_alloc_analysis still absent from
      # the report entirely. Covering it needs a different mechanism (e.g.
      # instrumenting the driver build itself), not a flag change here.
      # no_alloc_analysis is correspondingly ignored in codecov.yml.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --skip ui_matrix
      - run: cargo llvm-cov -p cargo-no-alloc --lib --lcov --output-path lcov-driver.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info,lcov-driver.info
          fail_ci_if_error: false
      - run: cargo bench --no-run
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo package -p no_alloc_check --no-verify
      - run: cargo package -p no_alloc_report --no-verify
      # These depend on packages staged earlier in the publication order.
      # Before those exist on crates.io, `--list` verifies their contents
      # without pretending registry resolution can succeed.
      - run: cargo package -p no_alloc_analysis --list
      - run: cargo package -p cargo-no-alloc --list
      - name: Install smoke test
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          cargo install --path crates/cargo_no_alloc --root "$install_root"
          test -x "$install_root/bin/cargo-no-alloc"
          test -x "$install_root/bin/no-alloc-driver"
          PATH="$install_root/bin:$PATH" cargo no-alloc --warn-only -- build --manifest-path examples/basic/Cargo.toml

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # no_alloc_check and no_alloc_report both declare rust-version = "1.88";
      # this is the only job that actually builds them on that toolchain
      # rather than whatever +stable happens to resolve to.
      - run: cargo test -p no_alloc_check -p no_alloc_report
