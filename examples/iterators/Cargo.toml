[workspace]

[package]
name = "iterators"
version = "0.1.0"
edition = "2024"

# Deliberately no `[profile.dev] panic` and no `cargo-features`: the panic
# strategy that makes these checkable comes from `--immediate-abort`, so this
# crate stays an ordinary crate that builds on stable (ADR 0002).

[dependencies]
no_alloc_check = { path = "../../crates/no_alloc_check" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(no_alloc_check)'] }
